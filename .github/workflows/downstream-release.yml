name: Downstream release

on:
  push:
    tags:
      - "pf-v*"

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build downstream packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: ".node-version"
          cache: true

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.8.0

      - name: Install dependencies
        run: vp install

      - name: Build packages
        run: |
          vp run --filter @blocknote/core build
          vp run --filter @blocknote/react build
          vp run --filter @blocknote/server-util build

      - name: Pack packages
        run: |
          mkdir -p artifacts/github artifacts/npm
          pnpm --dir packages/core pack --pack-destination ../../artifacts/github
          pnpm --dir packages/react pack --pack-destination ../../artifacts/github
          pnpm --dir packages/server-util pack --pack-destination ../../artifacts/github

      - name: Prepare downstream npm packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#pf-v}"
          UPSTREAM_VERSION="${RELEASE_VERSION%.*}"
          DOWNSTREAM_REVISION="${RELEASE_VERSION##*.}"
          PACKAGE_VERSION="${UPSTREAM_VERSION}-pf.${DOWNSTREAM_REVISION}"

          pnpm --dir packages/core pkg set \
            name=@pproenca/blocknote-core \
            version="$PACKAGE_VERSION" \
            homepage=https://github.com/pproenca/BlockNote \
            repository.url=git+https://github.com/pproenca/BlockNote.git
          pnpm --dir packages/core pkg delete gitHead
          pnpm --dir packages/react pkg set \
            name=@pproenca/blocknote-react \
            version="$PACKAGE_VERSION" \
            homepage=https://github.com/pproenca/BlockNote \
            repository.url=git+https://github.com/pproenca/BlockNote.git \
            "peerDependencies[\"@blocknote/core\"]=$PACKAGE_VERSION"
          pnpm --dir packages/react pkg delete gitHead
          pnpm --dir packages/server-util pkg set \
            name=@pproenca/blocknote-server-util \
            version="$PACKAGE_VERSION" \
            homepage=https://github.com/pproenca/BlockNote \
            repository.url=git+https://github.com/pproenca/BlockNote.git \
            "peerDependencies[\"@blocknote/core\"]=$PACKAGE_VERSION" \
            "peerDependencies[\"@blocknote/react\"]=$PACKAGE_VERSION"
          pnpm --dir packages/server-util pkg delete gitHead

          pnpm --dir packages/core pack --pack-destination ../../artifacts/npm
          pnpm --dir packages/react pack --pack-destination ../../artifacts/npm
          pnpm --dir packages/server-util pack --pack-destination ../../artifacts/npm

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Publish downstream packages
        run: |
          for package_dir in packages/core packages/react packages/server-util; do
            package_name=$(node -p "require('./$package_dir/package.json').name")
            package_version=$(node -p "require('./$package_dir/package.json').version")

            if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
              echo "$package_name@$package_version already exists; skipping"
              continue
            fi

            (cd "$package_dir" && npm publish --access public --tag pf --provenance)
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/github/*.tgz artifacts/npm/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/github/*.tgz artifacts/npm/*.tgz --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
