name: Downstream release

on:
  push:
    tags:
      - "pf-v*"

permissions: {}

concurrency:
  group: downstream-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Verify and publish downstream package set
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: ".node-version"
          cache: true

      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.8.0

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --test .github/scripts/downstream-release.test.mjs
          node .github/scripts/downstream-release.mjs validate "$RELEASE_TAG"

      - name: Verify tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Typecheck
        run: |
          pnpm typecheck

      - name: Build lint prerequisites
        run: |
          vp run --filter @blocknote/core build
          vp run --filter @blocknote/react build
          vp run --filter @blocknote/mantine build

      - name: Lint
        run: |
          vp lint --type-aware

      - name: Test packages
        run: |
          vp run --filter @blocknote/core test
          vp run --filter @blocknote/collaboration test
          vp run --filter @blocknote/collaboration-server test
          vp run --filter @blocknote/react test
          vp run --filter @blocknote/server-util test
          vp run --filter @blocknote/test-utils test
          cd tests
          NEXTJS_TEST_MODE=build vp test run src/unit/nextjs/serverUtil.test.ts

      - name: Build packages
        run: |
          vp run --filter @blocknote/core build
          vp run --filter @blocknote/collaboration build
          vp run --filter @blocknote/collaboration-server build
          vp run --filter @blocknote/react build
          vp run --filter @blocknote/server-util build
          vp run --filter @blocknote/test-utils build

      - name: Pack upstream packages
        run: |
          mkdir -p artifacts/github artifacts/npm
          for package_dir in \
            packages/core \
            packages/collaboration \
            packages/collaboration-server \
            packages/react \
            packages/server-util \
            packages/test-utils; do
            pnpm --dir "$package_dir" pack --pack-destination ../../artifacts/github
          done

      - name: Verify upstream package set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node .github/scripts/downstream-release.mjs verify-artifacts
          "$RELEASE_TAG" artifacts/github upstream

      - name: Prepare downstream package set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node .github/scripts/downstream-release.mjs prepare "$RELEASE_TAG"
          node .github/scripts/downstream-release.mjs verify "$RELEASE_TAG"

      - name: Pack downstream packages
        run: |
          for package_dir in \
            packages/core \
            packages/collaboration \
            packages/collaboration-server \
            packages/react \
            packages/server-util \
            packages/test-utils; do
            npm pack "./$package_dir" --pack-destination artifacts/npm --ignore-scripts
          done

      - name: Verify downstream package set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node .github/scripts/downstream-release.mjs verify-artifacts
          "$RELEASE_TAG" artifacts/npm downstream

      - name: Test downstream package set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          consumer_dir=$(mktemp -d)
          node .github/scripts/downstream-release.mjs create-consumer "$RELEASE_TAG" artifacts/npm "$consumer_dir"
          pnpm --dir "$consumer_dir" install --lockfile=false --ignore-scripts --prefer-offline
          node .github/scripts/downstream-release.mjs verify-consumer "$RELEASE_TAG" "$consumer_dir"
          node "$consumer_dir/runtime.mjs"
          node_modules/.bin/tsc --project "$consumer_dir/tsconfig.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Require an unused package version set
        run: |
          for package_dir in \
            packages/core \
            packages/collaboration \
            packages/collaboration-server \
            packages/react \
            packages/server-util \
            packages/test-utils; do
            package_name=$(node -p "require('./$package_dir/package.json').name")
            package_version=$(node -p "require('./$package_dir/package.json').version")
            published_version=$(npm view "$package_name@$package_version" version 2>/dev/null || true)

            if [ -n "$published_version" ]; then
              echo "$package_name@$package_version already exists; use a new downstream revision" >&2
              exit 1
            fi
          done

      - name: Publish downstream packages
        run: |
          for package_dir in \
            packages/core \
            packages/collaboration \
            packages/collaboration-server \
            packages/react \
            packages/server-util \
            packages/test-utils; do
            tarball_name=$(node -p "const p=require('./$package_dir/package.json'); p.name.slice(1).replace('/', '-') + '-' + p.version + '.tgz'")
            tarball_path="artifacts/npm/$tarball_name"
            npm publish "$tarball_path" --access public --tag pf --provenance
          done

      - name: Verify published package set
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for package_dir in \
            packages/core \
            packages/collaboration \
            packages/collaboration-server \
            packages/react \
            packages/server-util \
            packages/test-utils; do
            package_name=$(node -p "require('./$package_dir/package.json').name")
            package_version=$(node -p "require('./$package_dir/package.json').version")
            tarball_name=$(node -p "const p=require('./$package_dir/package.json'); p.name.slice(1).replace('/', '-') + '-' + p.version + '.tgz'")
            local_integrity=$(node .github/scripts/downstream-release.mjs integrity "$RELEASE_TAG" "artifacts/npm/$tarball_name")
            published_version=""
            published_integrity=""

            for attempt in 1 2 3 4 5 6; do
              echo "Registry verification attempt $attempt for $package_name@$package_version"
              published_version=$(npm view "$package_name@$package_version" version 2>/dev/null || true)
              published_integrity=$(npm view "$package_name@$package_version" dist.integrity 2>/dev/null || true)

              if [ "$published_version" = "$package_version" ] && [ "$published_integrity" = "$local_integrity" ]; then
                break
              fi

              sleep 5
            done

            test "$published_version" = "$package_version"
            test "$published_integrity" = "$local_integrity"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/github/*.tgz artifacts/npm/*.tgz --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/github/*.tgz artifacts/npm/*.tgz --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
