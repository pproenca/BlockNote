packages:
  - "packages/*"
  - "examples/*/*"
  - "playground"
  - "fumadocs"
  - "docs"
  - "shared"
  - "tests"
  - "../yjs"
preferWorkspacePackages: true
linkWorkspacePackages: true
gitChecks: false
minimumReleaseAge: 1440
publicHoistPattern:
  # We have been preferring to use `prosemirror-*` packages instead of `@tiptap/pm` packages
  - "prosemirror-*"
overrides:
  "@headlessui/react": "^2.2.4"
  "@tiptap/core": "^3.0.0"
  "@tiptap/pm": "^3.0.0"
  "vitest": "4.1.7"
  "@vitest/runner": "4.1.7"
  "@y/y": "workspace:@pproenca/y@*"
  "@y/prosemirror": "2.0.0-6"
  "lib0": "1.0.0-rc.22"
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  msw: true
  unrs-resolver: true
  canvas: false
  sharp: false
  workerd: false
  leveldown: false
patchedDependencies:
  "@hocuspocus/provider@4.4.0": ../../patches/@hocuspocus__provider@4.4.0.patch
  "@y/prosemirror@2.0.0-6": patches/@y__prosemirror@2.0.0-6.patch
catalog:
  vite-plus: ^0.1.24
catalogs:
  collaboration:
    "@hocuspocus/common": 4.4.0
    "@hocuspocus/extension-redis": 4.4.0
    "@hocuspocus/provider": 4.4.0
    "@hocuspocus/server": 4.4.0
    "@sesamecare-oss/redlock": 1.4.0
    y-indexeddb: 9.0.12
    y-prosemirror: 1.3.7
    y-protocols: 1.0.7
    yjs: 13.6.31
minimumReleaseAgeExclude:
  - vite-plus
  - lib0
  - "@y/y"
  - "@y/prosemirror"
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
